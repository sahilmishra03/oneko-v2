<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Oneko v2</title>
  <defs>
    <!-- rainbow blend of the site themes: Honey, Bloom, Lilac, Nocturne, Lagoon -->
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="480" y2="470">
      <stop offset=".1" stop-color="#f59e0b"/>
      <stop offset=".35" stop-color="#d946ef"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset=".72" stop-color="#6366f1"/>
      <stop offset=".92" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="shade" cx="35%" cy="22%" r="85%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1e0b3d" stop-opacity=".22"/>
    </radialGradient>
    <radialGradient id="cream" cx="45%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ebff"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-6 256 256)">
    <!-- ears -->
    <path d="M40 250 C25 160 45 75 95 30 Q112 18 128 32 C178 75 215 125 235 175 Z" fill="url(#fur)" stroke="url(#fur)" stroke-width="26" stroke-linejoin="round"/>
    <path d="M285 170 C310 115 350 65 405 30 Q425 20 436 38 C475 100 485 175 472 245 Z" fill="url(#fur)" stroke="url(#fur)" stroke-width="26" stroke-linejoin="round"/>
    <path d="M82 190 C78 140 88 100 108 75 C140 105 162 135 178 165 Z" fill="#ffffff" opacity=".55"/>
    <path d="M330 160 C352 120 380 90 410 72 C428 110 432 155 426 195 Z" fill="#ffffff" opacity=".55"/>
    <!-- head -->
    <ellipse cx="256" cy="300" rx="245" ry="205" fill="url(#fur)"/>
    <ellipse cx="256" cy="300" rx="245" ry="205" fill="url(#shade)"/>
    <!-- muzzle -->
    <ellipse cx="256" cy="392" rx="118" ry="86" fill="url(#cream)"/>
    <!-- eyes -->
    <ellipse cx="148" cy="290" rx="42" ry="50" fill="#1e0b3d"/>
    <ellipse cx="364" cy="290" rx="42" ry="50" fill="#1e0b3d"/>
    <circle cx="163" cy="271" r="15" fill="#ffffff"/>
    <circle cx="379" cy="271" r="15" fill="#ffffff"/>
    <!-- nose and mouth -->
    <path d="M236 354 h40 a8 8 0 0 1 5 14 l-20 16 a8 8 0 0 1 -10 0 l-20 -16 a8 8 0 0 1 5 -14 Z" fill="#d946ef"/>
    <path d="M222 402 q17 20 34 0 q17 20 34 0" fill="none" stroke="#1e0b3d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
